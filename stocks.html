<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stocks</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/annyang/2.6.1/annyang.min.js"></script>
  <script defer src="stocks.js"></script>
</head>
<body>
  <header>
    <h1>Stock Viewer</h1>
    <nav>
      <ul class="navbar">
        <li><a href="assignment2.html">Home</a></li>
        <li><a href="stocks.html">Stocks</a></li>
        <li><a href="dogs.html">Dogs</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="stock-form">
      <label for="ticker">Stock Ticker:</label>
      <input type="text" id="ticker" />
      <label for="days">Range:</label>
      <select id="days">
        <option value="30">30 Days</option>
        <option value="60">60 Days</option>
        <option value="90">90 Days</option>
      </select>
      <button class="custom-button" onclick="getStockData()">Get Chart</button>
    </section>

    <div class="chart-container">
      <canvas id="stockChart"></canvas>
    </div>

    <section>
      <h2>Top 5 Reddit Stocks</h2>
      <table id="reddit-table">
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Comments</th>
            <th>Sentiment</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="audio-instructions" class="audio-box">
      <h3>Audio Commands for Stocks Page</h3>
      <ul>
        <li>Say: "Lookup &lt;ticker&gt;"</li>
        <li>Say: "Navigate to &lt;page&gt;"</li>
        <li>Say: "Change the color to &lt;color&gt;"</li>
      </ul>
      <button onclick="startListening()">Turn On Listening</button>
      <button onclick="stopListening()">Turn Off Listening</button>
    </section>
  </main>
</body>
</html>
