<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dogs</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/annyang/2.6.1/annyang.min.js"></script>
  <script defer src="dogs.js"></script>
</head>
<body>
  <header>
    <h1>Doggos</h1>
    <nav>
      <ul class="navbar">
        <li><a href="assignment2.html">Home</a></li>
        <li><a href="stocks.html">Stocks</a></li>
        <li><a href="dogs.html">Dogs</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div id="dog-carousel"></div>
    <div id="breed-list"></div>

    <div id="breed-info" style="display:none">
      <h2 id="breed-name"></h2>
      <p id="breed-description"></p>
      <p><span id="min-life"></span> - <span id="max-life"></span> years</p>
    </div>

    <section id="audio-instructions" class="audio-box">
      <h3>Audio Commands for Dogs Page</h3>
      <ul>
        <li>Say: "Load dog breed &lt;name&gt;"</li>
        <li>Say: "Navigate to &lt;page&gt;"</li>
        <li>Say: "Change the color to &lt;color&gt;"</li>
      </ul>
      <button onclick="startListening()">Turn On Listening</button>
      <button onclick="stopListening()">Turn Off Listening</button>
    </section>
  </main>
</body>
